# Runs mcp-grafana standalone, pointing at the demo-services k3d cluster's
# Grafana (exposed on host port 3001 via k3d loadbalancer). The agent
# service on the host talks to this mcp-grafana at localhost:8080.
#
# Prerequisite: `cd ../demo-services && ./scripts/up.sh` must be running
# (k3d cluster up, Grafana reachable at http://localhost:3001).
#
# The full self-contained sidecar (Grafana + Prom/Loki/Tempo) was retired
# when v2 switched the data source to demo-services. See RUNBOOK.md.

services:
  mcp-grafana:
    container_name: aiops-mcp-grafana
    image: mcp/grafana:latest
    ports:
      - "8080:8080"
    environment:
      # k3d loadbalancer exposes Grafana on the host at :3001; from inside
      # the container we reach the host via host.docker.internal.
      GRAFANA_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "-t"
      - "streamable-http"
      - "--address"
      - ":8080"
      - "--disable-sift"
      - "--disable-oncall"
      - "--disable-incident"
      - "--disable-asserts"
      - "--disable-pyroscope"
