# Brings up the o11y-bench sidecar (Grafana + Prometheus + Loki + Tempo + mcp-grafana)
# with the AIOps plugin mounted from ./plugin/dist.
#
# Run the agent service separately on the host (uv run uvicorn ...) so hot-reload works.
# The agent talks to mcp-grafana at http://localhost:8080/mcp from the host.

services:
  sidecar:
    container_name: aiops-agent-sidecar
    build:
      context: ../docker
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # Grafana
      - "9090:9090"   # Prometheus
      - "3100:3100"   # Loki
      - "3200:3200"   # Tempo
      - "8080:8080"   # mcp-grafana
    environment:
      # Allow loading the unsigned AIOps plugin
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: tedmax100-aiops-app
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_LOG_FILTERS: plugin.tedmax100-aiops-app:debug
    volumes:
      # Mount plugin dist into Grafana's plugin directory.
      # Run `npm run dev` in ./plugin to keep dist/ rebuilt on every change.
      - ./plugin/dist:/var/lib/grafana/plugins/tedmax100-aiops-app:ro
      # Auto-enable the app on first launch (no manual click needed).
      - ./plugin/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
