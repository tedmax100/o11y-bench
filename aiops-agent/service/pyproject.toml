[project]
name = "aiops-agent-service"
version = "0.0.1"
description = "LangGraph + Gemini RCA agent service, talks to grafana-mcp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "langgraph>=0.2.50",
    "langchain-google-genai>=2.0",
    "langchain-mcp-adapters>=0.0.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
