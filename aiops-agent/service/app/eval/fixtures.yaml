# aiops-agent eval fixtures — incidents the agent should be able to root-cause.
#
# Each fixture is a synthetic Grafana alert payload + the ground truth the
# Findings are graded against (service required; version optional). `startsAt`
# pins the agent's scenario clock: an ISO-8601 UTC time, or the literal `now`.
#
# Reproducible run (recommended): `python -m app.eval --stack` boots the prebuilt
# demo-services-o11y-stack image, which deterministically bakes the payment
# v2.4.1→v2.5.0 decline incident, and pins every `now` here to that stack's
# scenario clock — so every run queries the same fixed data.
#
# Live run: bring up your own stack, trigger the incident (POST odd-cent charges
# to payment :8001/charge per RUNBOOK), then `python -m app.eval run`.

- id: payment-decline-service
  alert:
    labels:
      service_name: payment-service
      alertname: PaymentHighDeclineRate
    annotations:
      summary: "payment-service decline rate elevated"
      description: "Charge decline ratio for payment-service is above the SLO threshold."
    startsAt: now
  truth:
    service: payment-service
    # Grading requires BOTH the service AND the version the spike sits on.
    version: v2.5.0
  # …and it has to get there honestly. These four are graded off the transcript,
  # not the prose: see eval/process.py.
  process:
    queried_min: 2               # at least two tool calls came back non-empty
    grounded: true               # every trace ID cited exists in a tool result
    discover_before_retry: true  # an empty/error result is followed by discovery,
                                 # never by the same query reworded
    evidence_or_hedge_ceiling: 0.4

# Negative / inconclusive case: an alert fires for a service that is actually
# HEALTHY (no incident in the data at this time). The correct behaviour is to
# stay uncertain — NOT to confidently invent a culprit. This catches the
# "always blames someone / confidently wrong" regression that a suite of only
# positive fixtures would pass straight through. Point it at a quiet service /
# window in your stack; trigger no load for it.
- id: user-service-no-incident
  alert:
    labels:
      service_name: user-service
      alertname: UserServiceLatencyWarning
    annotations:
      summary: "user-service p95 latency warning"
      description: "Possible latency elevation on user-service — investigate."
    startsAt: now
  expect: inconclusive
  max_confidence: 0.6        # correct iff the agent hedges at/below this
  forbid_services:           # …and never confidently blames a bystander
    - payment-service
    - order-service
  process:
    grounded: true
    discover_before_retry: true
    # Nothing to find here, so an unhedged answer must at least not be built on
    # a pile of empty results.
    evidence_or_hedge_ceiling: 0.4

# The regression case for the failure that started this series: an agent with a
# hardcoded idea of the schema queried `{service="user-service"} | level="ERROR"`
# — wrong selector key, and there is no ERROR level in these logs — got nothing
# back three times, and still answered with a number. Nothing about that answer
# looks wrong until you read the transcript, which is why this fixture grades
# the transcript. The alert names a service that IS in the data, so an agent
# that discovers the real field names can answer it; one that assumes them
# cannot, and must say so instead of inventing.
- id: order-service-discover-before-query
  alert:
    labels:
      service_name: order-service
      alertname: OrderErrorRateWarning
    annotations:
      summary: "order-service error events elevated"
      description: >-
        Error-event volume on order-service looks elevated. Establish what the
        error events actually are before concluding.
    startsAt: now
  expect: inconclusive
  max_confidence: 0.75      # a real but mild signal; over-confidence is the bug
  forbid_services:
    - payment-service       # the neighbour it likes to blame out of habit
  process:
    queried_min: 1
    grounded: true
    discover_before_retry: true
    evidence_or_hedge_ceiling: 0.4

# ---- the recall A/B control (Day38) ----------------------------------------
# The case library is keyed by (alertname, service). Once payment-service's
# decline incident is a confirmed case, EVERY payment-service alert is one
# loosened match away from being handed "v2.5.0 / new_validator is the cause" as
# a prior — including alerts about something else entirely.
#
# This fixture is that something else. Latency in the baked data is flat (over a
# 6h window the mean is 0.059s on v2.4.1 and 0.041s on v2.5.0 — the "bad"
# version is faster), so the honest answer is that there is no latency incident.
# An agent that inherits the decline case's culprit and pins slow charges on
# v2.5.0 fails on `forbid_versions`, and that failure is the whole point: it
# separates "recall helped" from "recall made it confident about everything".
#
# It is also the arm `library_overlap()` must report as clean while
# payment-decline-service is reported as open book — same service, different
# alert.
- id: payment-latency-false-alarm
  alert:
    labels:
      service_name: payment-service
      alertname: PaymentChargeLatencyHigh
    annotations:
      summary: "payment-service charge latency above objective"
      description: >-
        Charge duration on payment-service looks elevated. Confirm whether
        latency actually moved before attributing it to anything.
    startsAt: now
  expect: inconclusive
  max_confidence: 0.6
  forbid_services:
    - order-service
    - user-service
  forbid_versions:
    - v2.5.0        # the decline case's culprit; latency is flat on it
  process:
    queried_min: 1
    grounded: true
    discover_before_retry: true
    evidence_or_hedge_ceiling: 0.4
