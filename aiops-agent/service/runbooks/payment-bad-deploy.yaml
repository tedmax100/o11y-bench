# Tier 0/1 runbook for the demo payment-service bad-deploy incident (v3 §5.1).
# Diagnostics are READ-ONLY and auto-run before the RCA; remediation is rendered
# for the on-call but NEVER executed at this tier (that's the action registry).
id: payment-bad-deploy
title: payment-service decline-rate spike after deploy

trigger:
  # Matches by trigger when the alert doesn't carry an explicit runbook_id.
  # An alert can also point here directly with annotations.runbook_id: payment-bad-deploy.
  alertname: payment-decline-rate-high
  labels:
    service_name: payment-service

diagnostics:
  - desc: Decline rate is concentrated on the running version (not spread across versions)
    action: query_prometheus
    args:
      expr: 'sum by (git_version, reason) (rate(payment_charges_total{status="declined"}[5m]))'
      queryType: instant
    expect: one git_version dominates the declined charges
    check:
      nonempty: true

  # The branch point. Deliberately carries no `check`: this step exists to tell
  # two incidents apart, not to assert a precondition, and a `check` that fails
  # on purpose in one branch would abort the fix that is right for the other
  # (execution.py aborts an approved action on any failed diagnostic check).
  - id: provenance
    desc: What the last rollouts actually changed — a template change, or only a restart
    action: k8s_change_provenance
    args:
      service: payment-service
    expect: >-
      "changed image/env" means a real deploy; "changed nothing the process runs"
      means the fault is in the mounted config and a rollback cannot help

  - desc: The running pod is healthy (rules out an infra/OOM cause)
    action: k8s_deployment_status
    args:
      service: payment-service
    expect: available_replicas == desired and no ProgressDeadlineExceeded
    check:
      contains: '"available_replicas"'

remediation:
  # Shown to the on-call; requires human approval. Executed only by the Tier 2
  # action registry (step 7), never by this layer.
  - desc: Roll back payment-service to the previous version
    # Only when the cluster says the pod template genuinely changed. The alert
    # carries a `git_version` label either way, and that label is the single
    # most misleading thing in this incident: four times in a row it produced a
    # correct-sounding "code regression in v2.5.0" and a rollback that restored
    # an identical template.
    when:
      diagnostic: provenance
      output_contains: "restores a genuinely different pod template"
    action: k8s.rollout_undo
    args:
      deployment: payment-service
      namespace: demo
    reversible: true
    requires_approval: true
    # Inverse-operation contract: rollout undo's undo is another rollout undo.
    rollback:
      action: k8s.rollout_undo
      args:
        deployment: payment-service
        namespace: demo
    # Post-execute verify (7b-4): confirm the decline rate dropped. Runs after
    # verify_delay_seconds settle window. Failure triggers auto-rollback.
    verify:
      action: query_prometheus
      args:
        expr: 'sum(rate(payment_charges_total{status="declined"}[2m]))'
        queryType: instant
      check:
        max_value: 0.01

  # The other shape of the same page: nothing shipped, someone flipped a flag in
  # the mounted ConfigMap and the pods restarted. `rollout undo` is a no-op here;
  # the flag is the change, so putting it back is the fix.
  # `manual.` is not a registered action, on purpose. payment-service reads its
  # flags once at process start, so flipping the ConfigMap without restarting the
  # pods changes nothing that is running — and `k8s.configmap_flag_set` does not
  # restart anything (user-service re-reads per request, which is why the same
  # action *is* executable in session-cache-timeout). Proposing it here would be
  # today's mistake wearing the other hat: the right diagnosis, an action that
  # cannot take effect. Until the action can restart the deployment, this branch
  # is written out for the on-call and executes nothing.
  - desc: >-
      Set payment_use_new_validator=false in the payment-flags ConfigMap, then restart
      payment-service (the flag is read at process start, so the flip alone does nothing)
    action: manual.configmap_flag_set_and_restart
    args:
      configmap: payment-flags
      namespace: demo
      key: flags.json
      flag: payment_use_new_validator
      value: false
    when:
      diagnostic: provenance
      output_contains: "the cause is outside the template"
    reversible: true
    requires_approval: true
