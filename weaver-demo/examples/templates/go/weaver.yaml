whitespace_control:
  trim_blocks: true
  lstrip_blocks: true

templates:
  - template: semconv_attrs.go.j2
    filter: >
      .groups
      | map(select(.type == "attribute_group" or .type == "span"))
      | map(.attributes[])
      | unique_by(.name)
      | sort_by(.name)
    application_mode: single
    file_name: "semconv_attrs.go"

  - template: semconv_metrics.go.j2
    filter: >
      .groups
      | map(select(.type == "metric"))
      | sort_by(.metric_name)
    application_mode: single
    file_name: "semconv_metrics.go"

  # 0.24.0 新增的 semconv_grouped_events helper：依 root namespace 分組 event
  - template: semconv_events.go.j2
    filter: semconv_grouped_events
    application_mode: single
    file_name: "semconv_events.go"

  - template: docs.md.j2
    filter: >
      .groups
      | map(select(.type == "metric" or .type == "span"))
    application_mode: single
    file_name: "docs/telemetry.md"
