# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.0/schemas/semconv.schema.v2.json
file_format: definition/2

attributes:
  - key: cart.session_id
    type: string
    stability: stable
    brief: "購物車 Session 識別碼"
    examples: ["sess-abc123", "sess-xyz789"]

  - key: cart.item_id
    type: string
    stability: stable
    brief: "加入購物車的商品 SKU"
    examples: ["SKU-001", "SKU-002"]

  - key: cart.item_quantity
    type: int
    stability: stable
    brief: "加入的商品數量"
    examples: [1, 2, 5]

  - key: cart.item_price
    type: double
    stability: stable
    brief: "商品單價（TWD）"
    examples: [299.0, 1500.0]

  - key: cart.total_amount
    type: double
    stability: stable
    brief: "結帳總金額（TWD）"
    examples: [598.0, 3000.0]

  - key: cart.item_count
    type: int
    stability: stable
    brief: "購物車中商品總件數"
    examples: [1, 3, 10]

metrics:
  - name: cart.add_item.count
    instrument: counter
    unit: "{items}"
    stability: stable
    requirement_level: recommended
    brief: "加入購物車的商品件數"
    attributes:
      - ref: cart.item_id
        requirement_level: required
      - ref: deployment.environment
        requirement_level: required

  - name: cart.checkout.total
    instrument: histogram
    unit: "{TWD}"
    stability: stable
    requirement_level: recommended
    brief: "每次結帳金額分佈（TWD）"
    attributes:
      - ref: deployment.environment
        requirement_level: required

  - name: cart.active_sessions
    instrument: updowncounter
    unit: "{sessions}"
    stability: stable
    requirement_level: recommended
    brief: "目前活躍的購物車 Session 數量"
    attributes:
      - ref: deployment.environment
        requirement_level: required

spans:
  - type: cart.add_item
    name:
      note: "使用 `cart.add_item` 作為 span 名稱。"
    kind: server
    stability: stable
    requirement_level: recommended
    brief: "將商品加入購物車的 Span"
    attributes:
      - ref_group: common.resource
      - ref: cart.session_id
        requirement_level: required
      - ref: cart.item_id
        requirement_level: required
      - ref: cart.item_quantity
        requirement_level: required
      - ref: cart.item_price
        requirement_level: required

  - type: cart.checkout
    name:
      note: "使用 `cart.checkout` 作為 span 名稱。"
    kind: server
    stability: stable
    requirement_level: recommended
    brief: "購物車結帳 Span"
    attributes:
      - ref_group: common.resource
      - ref: cart.session_id
        requirement_level: required
      - ref: cart.total_amount
        requirement_level: required
      - ref: cart.item_count
        requirement_level: required
