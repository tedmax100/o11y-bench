# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.0/schemas/semconv.schema.v2.json
file_format: definition/2

attributes:
  - key: service.name
    type: string
    stability: stable
    brief: "服務名稱"
    examples: ["payment-service", "cart-service"]

  - key: k8s.pod.name
    type: string
    stability: stable
    brief: "Pod 名稱"
    examples: ["payment-7d9f-abc", "cart-5c8d-xyz"]

  - key: k8s.node.name
    type: string
    stability: stable
    brief: "Node 名稱"
    examples: ["ip-10-0-1-2", "ip-10-0-1-3"]

  - key: git.tag
    type: string
    stability: stable
    brief: "部署的 Git 版本標籤"
    examples: ["v1.0.0", "v2.1.3-rc1"]

  - key: deployment.environment
    type: string
    stability: stable
    brief: "服務部署環境"
    examples: ["production", "staging", "development"]

  - key: service.team
    type: string
    stability: stable
    brief: "負責此服務的團隊名稱"
    examples: ["payments", "cart", "auth"]

entities:
  - type: service
    stability: stable
    requirement_level: recommended
    brief: "邏輯服務實體"
    identity:
      - ref: service.name
    description:
      - ref: service.team
        requirement_level: recommended

  - type: k8s.pod
    stability: stable
    requirement_level: recommended
    brief: "Kubernetes Pod 實體"
    identity:
      - ref: k8s.pod.name

  - type: k8s.node
    stability: stable
    requirement_level: recommended
    brief: "Kubernetes Node 實體"
    identity:
      - ref: k8s.node.name

attribute_groups:
  - id: common.resource
    visibility: public
    brief: "跨服務通用的資源屬性"
    stability: stable
    attributes:
      - ref: git.tag
        requirement_level: required
      - ref: deployment.environment
        requirement_level: required
      - ref: service.team
        requirement_level: recommended
