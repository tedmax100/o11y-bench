# GenAI conventions — the telemetry the aiops-agent emits about *itself*.
#
# The agent (LangGraph + Gemini RCA assistant under aiops-agent/service) now
# runs under `opentelemetry-instrument` with
# `opentelemetry-instrumentation-langchain`, so every Gemini call and LangGraph
# tool produces a GenAI span + GenAI metrics. This file is the convention those
# signals satisfy.
#
# NAMING: like the rest of this registry, these are the *idiomatic* names —
# here that means the official OpenTelemetry GenAI semantic conventions
# (`gen_ai.*`). The traceloop/OpenLLMetry instrumentor currently emits a few
# legacy spellings (`gen_ai.system`, `gen_ai.usage.prompt_tokens`, ...); the
# delta is recorded on each attribute's `note:` and is exactly what
# `weaver registry live-check` will flag against the running agent.
#
# `aiops.*` covers agent-specific concepts (the RCA tool set, the per-turn
# tool-call budget). Those are not emitted by zero-code instrumentation today —
# like the business spans in spans.yaml, they define the convention to satisfy
# if/when the agent opens manual spans for its RCA graph nodes.
groups:
  # ---------------------------------------------------------------------------
  # gen_ai.* — GenAI request/response attributes (official OTel semconv)
  # ---------------------------------------------------------------------------
  - id: registry.gen_ai
    type: attribute_group
    display_name: GenAI attributes
    brief: >-
      Attributes describing a single GenAI operation (an LLM chat call or a
      tool execution) performed by the agent. Align with the official
      OpenTelemetry `gen_ai.*` semantic conventions.
    attributes:
      - id: gen_ai.operation.name
        stability: development
        brief: The kind of GenAI operation the span represents.
        type:
          members:
            - id: chat
              value: chat
              brief: A chat-completion call to the model.
              stability: development
            - id: execute_tool
              value: execute_tool
              brief: Execution of a tool the model requested.
              stability: development

      - id: gen_ai.provider.name
        stability: development
        brief: The GenAI provider backing the request.
        note: >-
          Emitted as-is by the instrumentor (verified on the live agent), so it
          already matches the official semconv key — no live-check delta here.
        type:
          members:
            - id: gcp_gen_ai
              value: gcp.gen_ai
              brief: Google Cloud GenAI / Gemini (the agent's model — see GEMINI_MODEL).
              stability: development

      - id: gen_ai.request.model
        type: string
        stability: development
        brief: The model name requested.
        examples: ["gemini-3.1-flash-lite"]

      - id: gen_ai.response.model
        type: string
        stability: development
        brief: The model name that produced the response.
        examples: ["gemini-3.1-flash-lite"]

      - id: gen_ai.request.temperature
        type: double
        stability: development
        brief: >-
          The sampling temperature requested. The agent pins this to 0 for the
          RCA graph, intent gate and findings extractor; 0.3 for follow-ups.
        examples: [0, 0.3]

      - id: gen_ai.usage.input_tokens
        type: int
        stability: development
        brief: Tokens in the prompt sent to the model.
        note: >-
          Emitted as-is by the instrumentor (verified on the live agent) — the
          ReAct loop re-sends the system prompt each step, so this is the
          dominant cost; see the agent's `CONTINUE_PROMPT` optimisation.
        examples: [1024, 4096]

      - id: gen_ai.usage.output_tokens
        type: int
        stability: development
        brief: Tokens generated by the model in the response.
        examples: [128, 512]

      - id: gen_ai.usage.cache_read.input_tokens
        type: int
        stability: development
        brief: >-
          Input tokens served from the provider's context cache (billed at a
          discount). Surfaced by the instrumentor for Gemini; the gap between
          this and `gen_ai.usage.input_tokens` is the un-cached prompt cost.
        examples: [0, 4096]

      - id: gen_ai.token.type
        stability: development
        brief: Which side of the exchange a token count measures.
        note: Used to split the `gen_ai.client.token.usage` histogram.
        type:
          members:
            - id: input
              value: input
              brief: Prompt / input tokens.
              stability: development
            - id: output
              value: output
              brief: Completion / output tokens.
              stability: development

      - id: gen_ai.response.finish_reasons
        type: string[]
        stability: development
        brief: Why the model stopped generating, per choice.
        examples: [["stop"], ["tool_calls"], ["length"]]

      - id: gen_ai.tool.name
        type: string
        stability: development
        brief: >-
          The name of the tool executed on the model's behalf. For this agent
          that is one of the RCA tools (see `aiops.tool.name`).
        examples: ["query_prometheus", "query_loki_logs", "github_compare"]

  # ---------------------------------------------------------------------------
  # aiops.* — agent-specific concepts (target convention for manual spans)
  # ---------------------------------------------------------------------------
  - id: registry.aiops
    type: attribute_group
    display_name: AIOps agent attributes
    brief: >-
      Attributes specific to the aiops-agent's RCA loop. Not emitted by
      zero-code instrumentation today — the convention to satisfy if the agent
      opens manual spans for its graph nodes.
    attributes:
      - id: aiops.tool.name
        stability: development
        brief: The RCA tool the agent invoked (the bound LangGraph tool set).
        type:
          members:
            - id: query_prometheus
              value: query_prometheus
              brief: PromQL query against Prometheus.
              stability: development
            - id: query_loki_logs
              value: query_loki_logs
              brief: LogQL query against Loki.
              stability: development
            - id: query_tempo_traces
              value: query_tempo_traces
              brief: TraceQL query against Tempo.
              stability: development
            - id: discover_metrics
              value: discover_metrics
              brief: Discover the metrics a service emits.
              stability: development
            - id: discover_span_names
              value: discover_span_names
              brief: Discover the span/operation names a service has.
              stability: development
            - id: discover_log_fields
              value: discover_log_fields
              brief: Discover the log fields a service can be filtered on.
              stability: development
            - id: github_compare
              value: github_compare
              brief: Diff two deploy versions on a repo.
              stability: development
            - id: github_get_file
              value: github_get_file
              brief: Read a slice of a file at a ref.
              stability: development

      - id: aiops.intent.in_scope
        type: boolean
        stability: development
        brief: >-
          Whether the intent gate judged the user message in-scope for the
          observability/RCA assistant. `false` short-circuits to the refusal.

      - id: aiops.tool_calls.used
        type: int
        stability: development
        brief: Tool calls consumed so far this turn (RCA graph budget guard).
        examples: [0, 2, 4]

      - id: aiops.tool_calls.budget
        type: int
        stability: development
        brief: Hard per-turn tool-call ceiling enforced by the RCA graph.
        examples: [4]

      - id: aiops.tool.disposition
        stability: development
        brief: >-
          How `facts.classify` typed the tool's result. A tool that answered and
          a tool that returned nothing are both HTTP 200; this is the split that
          separates them.
        type:
          members:
            - id: observed
              value: observed
              brief: Real data came back and can be cited.
              stability: development
            - id: truncated
              value: truncated
              brief: Real but capped — usable, but not for totals or rates.
              stability: development
            - id: empty
              value: empty
              brief: The query was well-formed and matched nothing.
              stability: development
            - id: unavailable
              value: unavailable
              brief: The store could not be reached.
              stability: development
            - id: error
              value: error
              brief: The call failed or the payload could not be read.
              stability: development
            - id: context
              value: context
              brief: Catalog/discovery output — background, not an observation.
              stability: development

      - id: aiops.investigation.trigger
        stability: development
        brief: What started the investigation.
        type:
          members:
            - id: alert
              value: alert
              brief: A firing alert arrived on the webhook (headless run).
              stability: development
            - id: chat
              value: chat
              brief: A person asked a question in the assistant.
              stability: development

      - id: aiops.investigation.sufficient
        type: boolean
        stability: development
        brief: >-
          Whether the sufficiency gate (sufficiency.py) judged the evidence
          adequate. Computed from the run's own observations, never from the
          confidence the model states about itself.

      - id: aiops.investigation.pivots
        type: int
        stability: development
        brief: How many times the gate sent the run back for more evidence.
        examples: [0, 1, 2]

      - id: aiops.investigation.confidence
        type: double
        stability: development
        brief: >-
          The confidence the run stated in its own conclusion. Recorded, not
          trusted — it is the input to the calibration curve, not a gate.
        examples: [0.4, 0.85]

      - id: aiops.investigation.gaps
        type: string[]
        stability: development
        brief: >-
          Names of the sufficiency checks that did not pass. Span-only: the set
          varies per run and would mint a time series per phrasing as a metric
          dimension.
        examples: [["independent_domains", "causal_roles"]]

      - id: aiops.subject.service
        stability: development
        type: string
        brief: >-
          The service being investigated. Not `service.name` — that resource
          attribute is the agent itself, and conflating the two makes the
          agent's own telemetry look like the incident's.
        examples: ["payment", "orders"]

      - id: aiops.action.name
        stability: development
        type: string
        brief: The remediation action a runbook step proposes.
        examples: ["restart_deployment", "set_configmap_flag"]

      - id: aiops.governance.autonomy
        stability: development
        brief: What the governance gate decided may happen to a proposed action.
        type:
          members:
            - id: auto
              value: auto
              brief: Policy permits autonomous execution.
              stability: development
            - id: propose
              value: propose
              brief: Surface to a human to confirm.
              stability: development
            - id: escalate
              value: escalate
              brief: Hand back to a human; do not even pre-fill an action.
              stability: development

  # ---------------------------------------------------------------------------
  # aiops.* metrics + spans — emitted manually by app/telemetry.py
  # ---------------------------------------------------------------------------
  - id: metric.aiops.investigation.duration
    type: metric
    metric_name: aiops.investigation.duration
    stability: development
    brief: End-to-end duration of one RCA investigation, pivots included.
    instrument: histogram
    unit: s
    attributes:
      - ref: aiops.investigation.trigger
        requirement_level: required
      - ref: aiops.investigation.sufficient
        requirement_level: recommended
      - ref: aiops.subject.service
        requirement_level: recommended

  - id: metric.aiops.investigation.pivots
    type: metric
    metric_name: aiops.investigation.pivots
    stability: development
    brief: >-
      How many times the sufficiency gate sent a run back for more evidence.
      The loop working is pivots > 0 ending sufficient; the loop failing is
      pivots at the ceiling and still insufficient.
    instrument: histogram
    unit: "{pivot}"
    attributes:
      - ref: aiops.investigation.trigger
        requirement_level: required
      - ref: aiops.investigation.sufficient
        requirement_level: recommended
      - ref: aiops.subject.service
        requirement_level: recommended

  - id: metric.aiops.investigation.confidence
    type: metric
    metric_name: aiops.investigation.confidence
    stability: development
    brief: Distribution of the confidence runs state in their own conclusions.
    instrument: histogram
    unit: "1"
    attributes:
      - ref: aiops.investigation.trigger
        requirement_level: required
      - ref: aiops.investigation.sufficient
        requirement_level: recommended
      - ref: aiops.subject.service
        requirement_level: recommended

  - id: metric.aiops.tool.calls
    type: metric
    metric_name: aiops.tool.calls
    stability: development
    brief: RCA tool calls, split by how the result was typed.
    instrument: counter
    unit: "{call}"
    attributes:
      - ref: aiops.tool.name
        requirement_level: required
      - ref: aiops.tool.disposition
        requirement_level: required

  - id: metric.aiops.chat.turns
    type: metric
    metric_name: aiops.chat.turns
    stability: development
    brief: Interactive chat turns, split by the intent gate's verdict.
    instrument: counter
    unit: "{turn}"
    attributes:
      - ref: aiops.intent.in_scope
        requirement_level: required

  - id: metric.aiops.governance.decisions
    type: metric
    metric_name: aiops.governance.decisions
    stability: development
    brief: >-
      Remediation proposals leaving the governance gate. The autonomy split is
      the point: a flat zero on `auto` is the gate refusing, not the gate idle.
    instrument: counter
    unit: "{decision}"
    attributes:
      - ref: aiops.action.name
        requirement_level: required
      - ref: aiops.governance.autonomy
        requirement_level: required
      - ref: aiops.subject.service
        requirement_level: recommended

  - id: span.aiops.investigation
    type: span
    span_kind: internal
    stability: development
    brief: >-
      One whole RCA investigation. Parent of every model call, tool call and
      datastore round-trip in the run — the trace an investigation's stored
      `trace_id` points at.
    attributes:
      - ref: aiops.investigation.trigger
        requirement_level: required
      - ref: aiops.subject.service
        requirement_level: recommended
      - ref: aiops.investigation.sufficient
        requirement_level: recommended
      - ref: aiops.investigation.pivots
        requirement_level: recommended
      - ref: aiops.investigation.confidence
        requirement_level: recommended
      - ref: aiops.investigation.gaps
        requirement_level: opt_in

  # ---------------------------------------------------------------------------
  # GenAI metrics (official OTel `gen_ai.client.*`)
  # ---------------------------------------------------------------------------
  - id: metric.gen_ai.client.token.usage
    type: metric
    metric_name: gen_ai.client.token.usage
    stability: development
    brief: Tokens used per GenAI operation, split by direction.
    instrument: histogram
    unit: "{token}"
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: recommended
      - ref: gen_ai.token.type
        requirement_level: required

  - id: metric.gen_ai.client.operation.duration
    type: metric
    metric_name: gen_ai.client.operation.duration
    stability: development
    brief: Duration of a GenAI operation (an LLM call).
    instrument: histogram
    unit: s
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: recommended

  # ---------------------------------------------------------------------------
  # GenAI spans
  # ---------------------------------------------------------------------------
  - id: span.gen_ai.chat
    type: span
    span_kind: client
    stability: development
    brief: >-
      A chat-completion call from the agent to Gemini — emitted by the
      LangChain instrumentor for each LLM turn (RCA graph node, intent gate,
      findings extractor, follow-up suggester).
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.provider.name
        requirement_level: required
      - ref: gen_ai.request.model
        requirement_level: required
      - ref: gen_ai.response.model
        requirement_level: recommended
      - ref: gen_ai.request.temperature
        requirement_level: recommended
      - ref: gen_ai.usage.input_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.output_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.cache_read.input_tokens
        requirement_level: recommended
      - ref: gen_ai.response.finish_reasons
        requirement_level: recommended

  - id: span.gen_ai.execute_tool
    type: span
    span_kind: internal
    stability: development
    brief: >-
      Execution of an RCA tool the model requested during the ReAct loop.
    attributes:
      - ref: gen_ai.operation.name
        requirement_level: required
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: aiops.tool.name
        requirement_level: recommended
