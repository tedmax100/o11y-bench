# The twin environment: the same telemetry, renamed.
#
# Purpose is a controlled test of one claim — "governance is a function of the
# environment". Comparing the demo cluster against the Day1 generator stack
# confounds three variables at once (naming, missing k8s API, different data
# shape), so this namespace holds a second Prometheus/Loki/Tempo fed by the
# same collector, same traffic, same incident. The only difference is what
# things are called (see the rename processors in 13-otel-collector.yaml).
#
# Generated from 10-prometheus.yaml / 11-loki.yaml / 12-tempo.yaml with the
# namespace swapped; keep it that way, so the twin never drifts into being a
# second variable of its own. To regenerate after changing those three:
#
#   for f in k8s/1{0,1,2}-*.yaml; do echo ---; \
#     sed 's/^  namespace: demo$/  namespace: demo-twin/' "$f"; done
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-twin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: demo-twin
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: demo-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-remote-write-receiver"
            - "--enable-feature=exemplar-storage"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: demo-twin
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: demo-twin
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: true
      otlp_config:
        # Stream labels: low-cardinality, indexed. These are what `sum by (...)`
        # selectors filter on.
        resource_attributes:
          attributes_config:
            - action: index_label
              attributes:
                - service.name
                - git_repo
                - git_version
                - deployment.environment
        # event / level / trace_id / span_id flow through as structured metadata
        # (the OTLP default). LogQL can still aggregate on them via the
        # pipeline parser, e.g.:
        #   sum by (event) (count_over_time({service_name="..."} | json [5m]))
        # Loki rejects index_label on log_attributes — only resource_attributes
        # are eligible to become stream labels.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: demo-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.0
          args: ["-config.file=/etc/loki/config.yaml"]
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /tmp/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: demo-twin
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: demo-twin
data:
  config.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 1h

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: demo-twin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0
          args: ["-config.file=/etc/tempo/config.yaml"]
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /tmp/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: demo-twin
spec:
  selector:
    app: tempo
  ports:
    - port: 3200
      targetPort: 3200
      name: http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
