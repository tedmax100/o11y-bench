# AIOps agent service, running INSIDE the cluster so it reaches
# Prometheus/Loki/Tempo over internal DNS — no datasource NodePorts needed.
# The agent itself is exposed via a NodePort (host 8000 -> 30080) because the
# Grafana app plugin is frontend-only and the browser fetches /chat directly.
#
# Secrets (GOOGLE_API_KEY, GITHUB_TOKEN) are NOT in this manifest. Create them
# from the dev .env before applying, e.g.:
#   kubectl -n demo create secret generic aiops-agent-secrets \
#     --from-literal=google-api-key="$GOOGLE_API_KEY" \
#     --from-literal=github-token="$GITHUB_TOKEN"
# (scripts/up.sh sources aiops-agent/service/.env and does this automatically.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: demo
  labels:
    app: aiops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      containers:
        - name: aiops-agent
          image: aiops-agent/service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            # Direct native-API endpoints over internal cluster DNS.
            - name: PROMETHEUS_URL
              value: http://prometheus.demo.svc:9090
            - name: LOKI_URL
              value: http://loki.demo.svc:3100
            - name: TEMPO_URL
              value: http://tempo.demo.svc:3200
            - name: GEMINI_MODEL
              value: gemini-3.1-flash-lite
            # Browser loads the plugin UI from Grafana (:3001) and fetches the
            # agent NodePort (:8000) — so the page Origin is the Grafana one.
            - name: CORS_ALLOW_ORIGINS
              value: '["http://localhost:3000","http://localhost:3001"]'
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-secrets
                  key: google-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-agent-secrets
                  key: github-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-agent
  namespace: demo
spec:
  type: NodePort
  selector:
    app: aiops-agent
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
