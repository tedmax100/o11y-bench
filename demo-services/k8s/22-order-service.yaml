apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: demo
  labels:
    app: order-service
    git_version: v3.1.2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        git_version: v3.1.2
    spec:
      containers:
        - name: order
          image: demo-services/order:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GIT_REPO
              value: tedmax100/o11y-bench-order-service
            - name: GIT_VERSION
              value: v3.1.2
            - name: LOG_LEVEL
              value: INFO
            - name: USER_SERVICE_URL
              value: http://user-service.demo.svc:8000
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.demo.svc:8000
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment=demo,git_repo=tedmax100/o11y-bench-order-service,git_version=v3.1.2"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.demo.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: demo
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
