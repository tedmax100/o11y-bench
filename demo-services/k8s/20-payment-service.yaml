apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-flags
  namespace: demo
data:
  flags.json: |
    {"payment_use_new_validator": false}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  # NOTE: git_version is duplicated on Deployment + Pod labels so that
  # xk6-disruptor / kubectl can select by version (e.g. inject latency only
  # into v2.5.0). When you "deploy a new version", change BOTH the env var
  # GIT_VERSION and the label below — they must stay in sync.
  labels:
    app: payment-service
    git_version: v2.4.1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        git_version: v2.4.1
    spec:
      containers:
        - name: payment
          image: demo-services/payment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            # Plain env our stdout JSON formatter reads (it can't easily
            # parse OTEL_RESOURCE_ATTRIBUTES, so we duplicate these).
            - name: GIT_REPO
              value: tedmax100/o11y-bench-payment-service
            - name: GIT_VERSION
              value: v2.4.1
            - name: FEATURE_FLAGS_PATH
              value: /etc/demo/flags.json
            - name: LOG_LEVEL
              value: INFO
            # ── Zero-code OTel configuration (opentelemetry-distro reads all of these) ──
            - name: OTEL_SERVICE_NAME
              value: payment-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment=demo,git_repo=tedmax100/o11y-bench-payment-service,git_version=v2.4.1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.demo.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            # Inject trace_id / span_id onto every stdlib LogRecord so our
            # JSON formatter (and Loki) get them for free.
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: flags
              mountPath: /etc/demo
              readOnly: true
      volumes:
        - name: flags
          configMap:
            name: payment-flags
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: demo
spec:
  selector:
    app: payment-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-nodeport
  namespace: demo
spec:
  type: NodePort
  selector:
    app: payment-service
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30002
      name: http
