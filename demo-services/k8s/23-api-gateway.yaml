apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: demo
  labels:
    app: api-gateway
    git_version: v4.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        git_version: v4.0.0
    spec:
      containers:
        - name: gateway
          image: demo-services/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GIT_REPO
              value: tedmax100/o11y-bench-api-gateway
            - name: GIT_VERSION
              value: v4.0.0
            - name: LOG_LEVEL
              value: INFO
            - name: USER_SERVICE_URL
              value: http://user-service.demo.svc:8000
            - name: ORDER_SERVICE_URL
              value: http://order-service.demo.svc:8000
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service.demo.svc:8000
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment=demo,git_repo=tedmax100/o11y-bench-api-gateway,git_version=v4.0.0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.demo.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: demo
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
      name: http
