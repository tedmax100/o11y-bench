apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: demo
  labels:
    app: user-service
    git_version: v1.3.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        git_version: v1.3.0
    spec:
      containers:
        - name: user
          image: demo-services/user:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: GIT_REPO
              value: tedmax100/o11y-bench-user-service
            - name: GIT_VERSION
              value: v1.3.0
            - name: LOG_LEVEL
              value: INFO
            - name: OTEL_SERVICE_NAME
              value: user-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo,deployment.environment=demo,git_repo=tedmax100/o11y-bench-user-service,git_version=v1.3.0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.demo.svc:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: demo
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
      name: http
